<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EAES Video Corner Certificate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="certificate" aria-label="Certificate of completion">
        <div class="certificate__content">
          <div class="heading">
            <h1>CERTIFICATE</h1>
            <p>OF COMPLETION</p>
          </div>

          <div class="details">
            <div class="recipient">
              <p class="intro">This is to certify that</p>
              <p class="name">FULL NAME PLACEHOLDER</p>
              <div class="rule" aria-hidden="true"></div>
            </div>

            <div class="description">
              <p>Completed the theoretical</p>
              <p class="course">E-learning segment of the curriculum</p>
              <p>and successfully passed the assessment.</p>
            </div>
          </div>

          <div class="footer">
            <div class="signature-block">
              <img src="signature.png" alt="" class="signature" />
              <p class="footer-title">Prof. Nicole Bouvy</p>
              <p class="footer-caption">EAES President</p>
            </div>

            <div class="date-block">
              <p class="footer-title">ATTEMPMT submitted at dd.Month YYYY</p>
              <p class="footer-caption">Date of completion</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
